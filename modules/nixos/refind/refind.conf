# =============================================================================
#  rEFInd Configuration — Gruvbox Theme Dual Boot (NixOS & Windows 11)
# =============================================================================

# Timeout in seconds before default selection boots automatically
timeout 5

# Hide unnecessary UI elements for a clean minimalist look
hideui singleuser,hints,arrows,badges

# Do not modify NVRAM boot options
use_nvram false

# Only display manually configured menu entries (hides auto-scanned duplicates)
scanfor manual

# Big icon size & small icon size (pixel dimensions)
big_icon_size 128
small_icon_size 48

# Background Banner
banner /EFI/refind/gruvbox/img/bg2.png
banner_scale fillscreen

# Selection indicators
selection_big   /EFI/refind/gruvbox/img/selection_big.png
selection_small /EFI/refind/gruvbox/img/selection_small.png

# Control tools on bottom row
showtools reboot, shutdown, firmware

# ── 1. NixOS (via systemd-boot loader) ───────────────────────────────────────
menuentry "NixOS" {
    icon /EFI/refind/gruvbox/icons/os_nixos.png
    loader /EFI/systemd/systemd-bootx64.efi
}

# ── 2. Windows 11 ─────────────────────────────────────────────────────────────
menuentry "Windows 11" {
    icon /EFI/refind/gruvbox/icons/os_win.png
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}
