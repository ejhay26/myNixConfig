# =====================================================================
#  MangoWC / MangoWM Configuration
#  Matches user's Hyprland & Niri bindings and Noctalia Shell integration
# =====================================================================

# ── Autostart ──────────────────────────────────────────────────────────
exec-once = noctalia -d
exec-once = easyeffects --gapplication-service
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Look & Feel ────────────────────────────────────────────────────────
gaps_in = 5
gaps_out = 10
border_size = 2
cursor_theme = Bibata-Modern-Classic
cursor_size = 24

# ── App Shortcuts ──────────────────────────────────────────────────────
bind = SUPER, T, spawn, kitty
bind = SUPER, E, spawn, dolphin
bind = SUPER, B, spawn, brave

# ── Noctalia v5 Shell IPC Commands ─────────────────────────────────────
bind = SUPER, Tab, spawn, noctalia msg panel-toggle launcher
bind = SUPER, W, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER, V, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, U, spawn, noctalia msg bar-toggle
bind = SUPER, L, spawn, noctalia msg session lock
bind = SUPER, M, spawn, noctalia msg panel-toggle session
bind = SUPER, I, spawn, noctalia msg settings-toggle
bind = SUPER, Escape, spawn, noctalia msg settings-toggle
bind = SUPER, period, spawn, noctalia msg panel-toggle launcher /emoji

# ── Window Management ──────────────────────────────────────────────────
bind = SUPER, Q, killclient,
bind = SUPER, F, fullscreen,
bind = SUPER, SPACE, togglefloating,
bind = SUPER, H, iconify,

# ── Focus Navigation ───────────────────────────────────────────────────
bind = ALT, J, focusdir, left
bind = ALT, L, focusdir, right
bind = ALT, I, focusdir, up
bind = ALT, K, focusdir, down

# ── Hardware Keys: Brightness & Volume ────────────────────────────────
bind = , XF86MonBrightnessUp, spawn, brightnessctl s 10%+
bind = , XF86MonBrightnessDown, spawn, brightnessctl s 10%-
bind = , XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, spawn, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioPlay, spawn, playerctl play-pause
bind = , XF86AudioNext, spawn, playerctl next
bind = , XF86AudioPrev, spawn, playerctl previous

# ── Workspace / Tag Switching (ALT + 1–9) ──────────────────────────────
bind = ALT, 1, viewtag, 1
bind = ALT, 2, viewtag, 2
bind = ALT, 3, viewtag, 3
bind = ALT, 4, viewtag, 4
bind = ALT, 5, viewtag, 5
bind = ALT, 6, viewtag, 6
bind = ALT, 7, viewtag, 7
bind = ALT, 8, viewtag, 8
bind = ALT, 9, viewtag, 9

# ── Move Window to Workspace / Tag (ALT + SHIFT + 1–9) ──────────────────
bind = ALT+SHIFT, 1, tag, 1
bind = ALT+SHIFT, 2, tag, 2
bind = ALT+SHIFT, 3, tag, 3
bind = ALT+SHIFT, 4, tag, 4
bind = ALT+SHIFT, 5, tag, 5
bind = ALT+SHIFT, 6, tag, 6
bind = ALT+SHIFT, 7, tag, 7
bind = ALT+SHIFT, 8, tag, 8
bind = ALT+SHIFT, 9, tag, 9
