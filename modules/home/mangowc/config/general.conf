# =====================================================================
#  config/general.conf — Gaps, Borders, Cursor, & Layout
# =====================================================================

# ── Gaps & Borders ───────────────────────────────────────────────────
gappih = 8
gappiv = 8
gappoh = 12
gappov = 12
borderpx = 2

# ── Cursor ───────────────────────────────────────────────────────────
cursor_theme = Bibata-Modern-Classic
cursor_size = 24

# ── Scroller & Layout ────────────────────────────────────────────────
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 1
smartgaps = 0
no_border_when_single = 0
