# =====================================================================
#  config/binds.conf — Keybindings & Mouse Controls
#  Matches Hyprland & Niri bindings & Noctalia v5 Shell IPC
# =====================================================================

# ── App Shortcuts ────────────────────────────────────────────────────
bind = SUPER, T, spawn, kitty
bind = SUPER, E, spawn, dolphin
bind = SUPER, B, spawn, brave
bind = SUPER, G, spawn, toggle-scrolling
bind = SUPER, Y, spawn, pkill waybar || waybar

# ── Noctalia v5 Shell IPC Commands ───────────────────────────────────
bind = SUPER, Tab, spawn, noctalia msg panel-toggle launcher
bind = SUPER, W, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER, V, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, U, spawn, noctalia msg bar-toggle
bind = SUPER, L, spawn, noctalia msg session lock
bind = SUPER, M, spawn, noctalia msg panel-toggle session
bind = SUPER, I, spawn, noctalia msg settings-toggle
bind = SUPER, Escape, spawn, noctalia msg settings-toggle
bind = SUPER, period, spawn, noctalia msg panel-toggle launcher /emoji

# ── Window Management ────────────────────────────────────────────────
bind = SUPER, Q, killclient,
bind = SUPER, F, togglefullscreen,
bind = SUPER, SPACE, togglefloating,
bind = SUPER, H, minimized,

# ── Focus Navigation (IJKL & Arrows) ─────────────────────────────────
bind = ALT, I, focusdir, up
bind = ALT, K, focusdir, down
bind = ALT, J, focusdir, left
bind = ALT, L, focusdir, right

# ── Window Resizing & Movement ───────────────────────────────────────
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50, +0
bind = CTRL+SHIFT, Right, movewin, +50, +0

bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# ── Hardware Keys: Brightness & Volume ──────────────────────────────
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl s 10%+
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl s 10%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous

# ── Workspace / Tag Switching (ALT + 1–9) ────────────────────────────
bind = ALT, 1, view, 1, 0
bind = ALT, 2, view, 2, 0
bind = ALT, 3, view, 3, 0
bind = ALT, 4, view, 4, 0
bind = ALT, 5, view, 5, 0
bind = ALT, 6, view, 6, 0
bind = ALT, 7, view, 7, 0
bind = ALT, 8, view, 8, 0
bind = ALT, 9, view, 9, 0

# ── Move Window to Workspace / Tag (ALT + SHIFT + 1–9) ────────────────
bind = ALT+SHIFT, 1, tag, 1, 0
bind = ALT+SHIFT, 2, tag, 2, 0
bind = ALT+SHIFT, 3, tag, 3, 0
bind = ALT+SHIFT, 4, tag, 4, 0
bind = ALT+SHIFT, 5, tag, 5, 0
bind = ALT+SHIFT, 6, tag, 6, 0
bind = ALT+SHIFT, 7, tag, 7, 0
bind = ALT+SHIFT, 8, tag, 8, 0
bind = ALT+SHIFT, 9, tag, 9, 0

# ── Mouse Controls ───────────────────────────────────────────────────
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize
