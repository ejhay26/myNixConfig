input {
    kb_layout = us
    # follow_mouse = 2 # Click to focus
    float_switch_override_focus = 0
}

general {
    gaps_in = 8
    gaps_out = 12 # the gaps around the entire tiles
    border_size = 0
    # Not too bright borders (muted teal/green)
    col.active_border = rgba(ffffffff) 45deg #rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
}

env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

#layerrule {
  #name = noctalia
  #match:namespace = noctalia-background-.*$
  #ignore_alpha = 0.5
  #blur = true
 # blur_popups = true
#}
# workspace = 2, layout:scrolling

# Scrolling layout configuration for partial window visibility
scrolling {
    follow_min_visible = 0.1  # Allow windows to be mostly off-screen before auto-scrolling
    focus_fit_method = 0      # Center focused window (0 = center, 1 = fit)
    follow_focus = false       # Auto-scroll to bring focused window into view
    direction = right         # Direction: right/left/up/down
}
