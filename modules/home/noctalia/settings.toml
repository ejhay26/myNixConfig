[plugins]
enabled = []

[shell]
corner_radius_scale = 1.2500000186264515
font_family = "JetBrainsMono NF"
panel_anchor_bar = "default"

    [shell.animation]
    speed = 0.65000000968575478

    [shell.launcher]
    app_grid = true
    pinned = [ "org.vinegarhq.Sober", "brave-browser", "discord" ]

    [shell.panel]
    clipboard_placement = "attached"
    floating_offset = 0
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/terajaki/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.46999998949468136

[theme]
builtin = "Gruvbox"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "hyprland", "kitty", "labwc", "mango", "niri", "qt" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/terajaki/Pictures/Wallpapers/pexels-eberhardgross-1303431.jpg"

    [wallpaper.last]
    path = "/home/terajaki/Pictures/Wallpapers/pexels-eberhardgross-1303431.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/terajaki/Pictures/Wallpapers/pexels-eberhardgross-1303431.jpg"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.clock]
anchor = true
font_family = "JetBrainsMono Nerd Font Mono"
font_weight = 700
format = "{:%I:%M %p %B %d, %Y}"
timezone = "Asia/Manila"

[widget.cpu]
label_show_units = false

[widget.launcher]
custom_image_colorize = true
glyph = "snowflake"

[widget.media]
artist_first = true
hide_when_no_media = true
max_length = 253
show_progress = true

[widget.network]
show_label = false
show_vpn_label = true

[widget.privacy]
hide_inactive = true

[widget.ram]
label_show_units = false

[widget.sysmon]
stat = "ram_used"

[widget.tray]
drawer = true
hide_passive = false
match_adjacent_spacing = true

[widget.volume]
show_label = false