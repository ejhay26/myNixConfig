config_version = 13

[bar]
order = [ "default", "left_frame", "right_frame", "bottom_frame" ]

    [bar.bottom_frame]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    panel_overlap = 3
    position = "bottom"
    start = []
    thickness = 12

    [bar.default]
    border = "surface_variant"
    capsule_thickness = 0.74999998696148396
    center = [ "audio_visualizer", "clock", "privacy" ]
    contact_shadow = true
    end = [ "media", "taskbar", "tray", "session" ]
    margin_ends = 0
    padding = 12
    panel_overlap = 3
    start = [ "launcher", "workspaces", "active_window" ]
    thickness = 30
    widget_spacing = 12

    [bar.left_frame]
    center = []
    enabled = true
    end = []
    margin_ends = 0
    panel_overlap = 3
    position = "left"
    start = []
    thickness = 12

    [bar.right_frame]
    center = []
    enabled = true
    end = [ "ram", "cpu", "power_profile", "battery" ]
    margin_ends = 0
    panel_overlap = 3
    position = "right"
    start = [ "network", "bluetooth", "brightness", "volume", "notifications", "clipboard" ]
    thickness = 30
    widget_spacing = 12

